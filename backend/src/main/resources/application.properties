spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.application.name=supermarket-bigdata

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supermarket_api}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
jwt.secret=${JWT_SECRET:c3VwZXJtYXJrZXRfc2VjcmV0X2tleV8yNTZiaXRzX2V4YW1wbGVfMTIzNDU2Nzg5}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
server.port=8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
jwt.expiration=900000

# Dựng database mới bằng SQL/schema.sql; backend không tự quản lý schema.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=never


# Cấu hình logging level cho các package và class cụ thể
logging.level.com.api.supermarket=DEBUG
# Cấu hình logging level cho service và controller cụ thể
logging.level.com.api.supermarket.service = DEBUG
logging.level.com.api.supermarket.controller.LoggingTestController = TRACE
logging.file.name=logs/supermarket-bigdata.log
# Cấu hình logging level cho Hibernate SQL để hiển thị câu lệnh SQL trong log
logging.level.org.hibernate.SQL=OFF
# Cấu hình logback để tạo file log theo ngày và nén file log cũ
logging.logback.rollingpolicy.file-name-pattern=logs/supermarket.%d{dd-MM-yyyy}.%i.log.gz
# Giới hạn kích thước file log, ví dụ: 10MB
logging.logback.rollingpolicy.max-file-size=10MB
# Giới hạn số lượng file log được lưu trữ, ví dụ: 30 file log
logging.logback.rollingpolicy.max-history=30
# Giới hạn tổng dung lượng log được lưu trữ, ví dụ: 1GB
logging.logback.rollingpolicy.total-size-cap=1GB 
integration.sync.enabled=${SYNC_ENABLED:true}
integration.sync.interval-ms=${SYNC_INTERVAL_MS:10000}
integration.sync.batch-size=${SYNC_BATCH_SIZE:25}
integration.local-bootstrap=${LOCAL_BOOTSTRAP:false}
integration.analytics-directory=${ANALYTICS_DIRECTORY:../analytics/cassandra}
drill.url=${DRILL_URL:http://localhost:8047}
drill.timeout-seconds=${DRILL_TIMEOUT_SECONDS:60}
analytics.simulation.snapshot-date=${SIMULATION_SNAPSHOT_DATE:2026-10-14}
analytics.simulation.dataset-id=${SIMULATION_DATASET_ID:sim-421014-100000-2026-10-14}
astra.enabled=${ASTRA_ENABLED:false}
astra.mode=${CASSANDRA_MODE:LOCAL}
astra.host=${CASSANDRA_HOST:127.0.0.1}
astra.port=${CASSANDRA_PORT:9042}
astra.local-datacenter=${CASSANDRA_DATACENTER:datacenter1}
astra.application-token=${APPLICATION_TOKEN:}
astra.secure-connect-bundle=${ASTRA_SECURE_BUNDLE:}
astra.keyspace=${ASTRA_KEYSPACE:supermarket_analytics}


# Direct Drill sources; identifiers allow only letters, digits and underscores.
drill.cassandra.keyspace=${DRILL_CASSANDRA_KEYSPACE:supermarket_analytics}
drill.mysql.schema=${DRILL_MYSQL_SCHEMA:supermarket_api}
