spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]
spring.application.name=supermarket-nosql
server.port=8080

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Xác thực
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_ACCESS_MS:900000}
jwt.refresh-days=${JWT_REFRESH_DAYS:7}
# Tạo tài khoản "admin" lúc khởi động nếu collection users trống. Để trống thì không tạo.
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:}
# Dữ liệu demo (chỉ khi chưa có sản phẩm): tài khoản thukho01, thungan01, thungan02 dùng APP_SEED_PASSWORD
app.seed.demo=${APP_SEED_DEMO:false}
app.seed.password=${APP_SEED_PASSWORD:}
app.seed.orders=${APP_SEED_ORDERS:80}

# Nghiệp vụ
app.timezone=${APP_TIMEZONE:Asia/Ho_Chi_Minh}
app.return-window-days=${RETURN_WINDOW_DAYS:7}

# MongoDB Atlas – nguồn sự thật (phải là replica set để có transaction)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.mongodb.database=${MONGODB_DATABASE:supermarket}
spring.data.mongodb.representation.big-decimal=decimal128
spring.data.mongodb.auto-index-creation=false
# MongoDB cài máy: tự initiate replica set 1 node (mongod phải có replication.replSetName)
app.mongo.init-replset=${MONGODB_INIT_REPLSET:false}
app.mongo.replset-name=${MONGODB_REPLSET_NAME:rs0}
app.mongo.replset-host=${MONGODB_REPLSET_HOST:127.0.0.1:27017}

# Redis – dữ liệu tạm; timeout ngắn để Redis lỗi không làm chậm request
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=1s
spring.data.redis.connect-timeout=1s

# Cassandra (Astra DB hoặc local)
app.cassandra.mode=${CASSANDRA_MODE:ASTRA}
app.cassandra.bundle=${ASTRA_SECURE_BUNDLE:../secrets/secure-connect-supermarket-bigdata.zip}
app.cassandra.token=${APPLICATION_TOKEN:}
app.cassandra.keyspace=${CASSANDRA_KEYSPACE:supermarket}
app.cassandra.local-contact=${CASSANDRA_HOST:127.0.0.1}:${CASSANDRA_PORT:9042}
app.cassandra.local-dc=${CASSANDRA_DATACENTER:datacenter1}

# Neo4j AuraDB
app.neo4j.uri=${NEO4J_URI:}
app.neo4j.username=${NEO4J_USERNAME:neo4j}
app.neo4j.password=${NEO4J_PASSWORD:}

# Đồng bộ sang Cassandra/Neo4j và tạo schema lúc khởi động
app.sync.enabled=${SYNC_ENABLED:true}
app.sync.interval-ms=60000
app.sync.min-age-seconds=30
app.sync.max-attempts=10
app.schema.init=${SCHEMA_INIT:true}

# /actuator/health chỉ báo ứng dụng sống; trạng thái 4 CSDL xem ở /api/health/datastores
management.health.mongodb.enabled=false
management.health.redis.enabled=false

# Logging
logging.level.com.api.supermarket=DEBUG
logging.file.name=logs/supermarket.log
logging.logback.rollingpolicy.file-name-pattern=logs/supermarket.%d{dd-MM-yyyy}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
